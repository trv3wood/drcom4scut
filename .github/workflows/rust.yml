name: Rust

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NPCAP_SDK_URL: https://npcap.com/dist/npcap-sdk-1.15.zip
  NPCAP_SDK_CACHE_DIR: .\tmp\npcap-sdk

jobs:
  ci:
    if: github.event_name == 'pull_request' || !startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-check
            command: cargo check --verbose
          - os: ubuntu-latest
            label: linux-test
            command: cargo test --verbose
          - os: windows-latest
            label: windows-check
            command: cargo check --verbose

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Windows dependencies
        if: matrix.os == 'windows-latest'
        id: cache-windows
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ env.NPCAP_SDK_URL }}
          path: ${{ env.NPCAP_SDK_CACHE_DIR }}

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest' && steps.cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sdkRoot = "${{ env.NPCAP_SDK_CACHE_DIR }}"
          New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null
          $zipPath = Join-Path (Split-Path $sdkRoot -Parent) "npcap-sdk.zip"
          Invoke-WebRequest -Uri $env:NPCAP_SDK_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $sdkRoot -Force

      - name: Export Windows SDK path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdkRoot = (Resolve-Path "${{ env.NPCAP_SDK_CACHE_DIR }}").Path
          if (-not (Test-Path (Join-Path $sdkRoot "Lib\\x64\\Packet.lib"))) {
            throw "Packet.lib not found under $sdkRoot"
          }
          "NPCAP_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ${{ matrix.label }}
        run: ${{ matrix.command }}

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: drcom4scut.exe
            archive_name: drcom4scut-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: drcom4scut
            archive_name: drcom4scut-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: drcom4scut
            archive_name: drcom4scut-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: drcom4scut
            archive_name: drcom4scut-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Set up cross toolchain
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'x86_64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache Windows dependencies
        if: matrix.os == 'windows-latest'
        id: cache-windows
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ env.NPCAP_SDK_URL }}
          path: ${{ env.NPCAP_SDK_CACHE_DIR }}

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest' && steps.cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sdkRoot = "${{ env.NPCAP_SDK_CACHE_DIR }}"
          New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null
          $zipPath = Join-Path (Split-Path $sdkRoot -Parent) "npcap-sdk.zip"
          Invoke-WebRequest -Uri $env:NPCAP_SDK_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $sdkRoot -Force

      - name: Export Windows SDK path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdkRoot = (Resolve-Path "${{ env.NPCAP_SDK_CACHE_DIR }}").Path
          if (-not (Test-Path (Join-Path $sdkRoot "Lib\\x64\\Packet.lib"))) {
            throw "Packet.lib not found under $sdkRoot"
          }
          "NPCAP_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD "dist\${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" $stageDir
          Compress-Archive -Path "$stageDir\*" -DestinationPath "dist\${{ matrix.archive_name }}" -Force

      - name: Package release asset (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euxo pipefail
          stage_dir="dist/${{ matrix.target }}"
          mkdir -p "$stage_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$stage_dir/"
          tar -C "$stage_dir" -czf "dist/${{ matrix.archive_name }}" .

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  release-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
