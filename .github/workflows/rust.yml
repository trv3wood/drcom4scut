name: Rust
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
  NPCAP_SDK_URL: "https://npcap.com/dist/npcap-sdk-1.15.zip"
  NPCAP_SDK_CACHE_DIR: .\tmp\npcap-sdk
  bin_dir: ./tmp_bin
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Cache Windows dependencies
        if: matrix.os == 'windows-latest'
        id: cache-windows
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ env.NPCAP_SDK_URL }}
          path: ${{ env.NPCAP_SDK_CACHE_DIR }}
      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest' && steps.cache-windows.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sdkRoot = "${{ env.NPCAP_SDK_CACHE_DIR }}"
          New-Item -ItemType Directory -Path $sdkRoot -Force | Out-Null
          $zipPath = Join-Path (Split-Path $sdkRoot -Parent) "npcap-sdk.zip"
          Invoke-WebRequest -Uri $env:NPCAP_SDK_URL -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $sdkRoot -Force
      - name: Export Windows SDK path
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $sdkRoot = (Resolve-Path "${{ env.NPCAP_SDK_CACHE_DIR }}").Path
          if (-not (Test-Path (Join-Path $sdkRoot "Lib\\x64\\Packet.lib"))) {
            throw "Packet.lib not found under $sdkRoot"
          }
          "NPCAP_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build
        run: cargo build --verbose
      - name: Build for release
        run: cargo build --release --verbose
      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --verbose
      - name: Cargo Install
        run: cargo install --locked --path . --target-dir target --root ${{ env.bin_dir }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drcom4scut-${{ matrix.target }}
          path: ${{ env.bin_dir }}/bin
